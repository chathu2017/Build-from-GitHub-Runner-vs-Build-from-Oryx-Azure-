name: Build on Azure (Oryx Engine)

on:
  push:
    branches:
      - main

jobs:
  deploy-raw-code:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # මෙතන Python setup කරන, pip install කරන කිසිම කෑල්ලක් නෑ!
    # අපි කෙලින්ම Raw Code එක Azure එකට යවනවා.
    - name: Deploy to Azure Web App (Raw Code)
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'app-oryx-build' # ඔයාගේ දෙවෙනි App එකේ නම මෙතනට දෙන්න
        publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_2 }}
        package: .
