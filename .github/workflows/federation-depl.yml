name: Build on Azure (OIDC Passwordless)

on:
  push:
    branches:
      - main

# මේක අනිවාර්යයි! මේකෙන් තමයි OIDC Token එක ඉල්ලන්නේ
permissions:
      id-token: write
      contents: read

jobs:
  deploy-raw-code:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # පරණ Publish Profile එක වෙනුවට අපි OIDC Login එක පාවිච්චි කරනවා
    - name: 'Azure Login via OIDC'
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Deploy to Azure Web App (Raw Code for Oryx)
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'app-oryx-build-Federated-Identity' # ඔයාගේ App Service නම
        package: .
